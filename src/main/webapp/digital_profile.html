<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Student Profile</title>
</head>
<body>

    <h2>Create Digital Student Profile</h2>

    <form action="store_profile.jsp" method="post">
        <label for="studentId">Student ID:</label><br>
        <input type="text" id="studentId" name="studentId" required><br><br>

        <label for="name">Student Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="department">Department:</label><br>
        <input type="text" id="department" name="department" required><br><br>

        <label for="semester">Semester:</label><br>
        <input type="text" id="semester" name="semester" required><br><br>

        <input type="submit" value="Save Profile to Bean">
    </form>

</body>
</html>

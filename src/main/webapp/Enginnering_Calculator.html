<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Engineering Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .calculator {
            width: 320px;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Engineering Desktop Calculator</h2>

    <div class="calculator">
        <div class="form-group">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" step="any" required>
        </div>

        <div class="form-group">
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" step="any" required>
        </div>

        <div class="form-group">
            <label for="operation">Operation:</label>
            <select id="operation">
                <option value="Add">Add</option>
                <option value="Subtract">Subtract</option>
                <option value="Multiply">Multiply</option>
                <option value="Divide">Divide</option>
            </select>
        </div>

        <button onclick="calculate()">Calculate</button>

        <div id="result">Result / Status: </div>
    </div>

    <script>
        function calculate() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operation = document.getElementById('operation').value;
            const resultDiv = document.getElementById('result');

            if (num1 === "" || num2 === "") {
                resultDiv.innerText = "Result / Status: Please enter both numbers";
                return;
            }

            const params = new URLSearchParams();
            params.append('num1', num1);
            params.append('num2', num2);
            params.append('operation', operation);

            fetch('CalculatorServlet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
            .then(response => response.text())
            .then(data => {
                resultDiv.innerText = data;
            })
            .catch(error => {
                resultDiv.innerText = "Error connecting to server";
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>College Student Login Portal</title>
</head>
<body>

    <h2>College Student Login Portal</h2>

    <form action="login_process.jsp" method="post">
        <label for="studentName">Student Name:</label><br>
        <input type="text" id="studentName" name="studentName" required><br><br>

        <label for="studentId">Student ID / Roll No:</label><br>
        <input type="text" id="studentId" name="studentId" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>

    <p><small><em>(Demo Credentials: Any Name/ID with password <strong>student123</strong>)</em></small></p>

</body>
</html>
